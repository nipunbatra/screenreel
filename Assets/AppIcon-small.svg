<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Screenreel app icon. A single strip of film folded into the initial S;
       the newest frame at the strip's tail is coral: the take being written.
       Geometry: Apple's macOS icon grid (824 px stage, r=185, in a 1024 canvas).
       Only gradients, clip and plain feGaussianBlur (on groups/fills) are
       used so that CoreSVG (AppKit), librsvg and browsers render it alike.
       Generated by Assets/brand/make-sources.py.
       Small-size variant (16/32 px): no pane detail, coral tail. -->
  <defs>
    <clipPath id="stage"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="ground" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E1E7EF"/>
    </linearGradient>
    <linearGradient id="ink" x1="512" y1="241" x2="512" y2="783" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B416A"/><stop offset="0.55" stop-color="#1B2B4A"/><stop offset="1" stop-color="#0E1830"/>
    </linearGradient>
    <linearGradient id="coral" x1="512" y1="665" x2="512" y2="783" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9A7E"/><stop offset="1" stop-color="#E8482F"/>
    </linearGradient>
    <radialGradient id="coralGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(346 724) scale(170)">
      <stop stop-color="#FF6A4A" stop-opacity="0.30"/><stop offset="1" stop-color="#FF6A4A" stop-opacity="0"/>
    </radialGradient>
    <filter id="stageShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="stripShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <!-- stage shadow (Apple's: y+10, ~30 %) and the light glass stage -->
  <rect x="100" y="110" width="824" height="824" rx="185" fill="#000000" fill-opacity="0.30" filter="url(#stageShadow)"/>
  <g clip-path="url(#stage)">
    <rect x="100" y="100" width="824" height="824" fill="url(#ground)"/>

    <!-- strip shadow (filter on the group: CoreSVG mis-blurs bare strokes) -->
    <g filter="url(#stripShadow)" transform="translate(0 14)">
      <path d="M722 300H408A106 106 0 0 0 302 406A106 106 0 0 0 408 512H616A106 106 0 0 1 722 618A106 106 0 0 1 616 724H302" fill="none" stroke-width="118" stroke-linecap="round" stroke-linejoin="round" stroke="#0E1830" stroke-opacity="0.26"/>
    </g>
    <!-- the strip -->
    <path d="M722 300H408A106 106 0 0 0 302 406A106 106 0 0 0 408 512H616A106 106 0 0 1 722 618A106 106 0 0 1 616 724H302" fill="none" stroke-width="118" stroke-linecap="round" stroke-linejoin="round" stroke="url(#ink)"/>
    <!-- top-edge light -->
    <path d="M722 300H408A106 106 0 0 0 302 406A106 106 0 0 0 408 512H616A106 106 0 0 1 722 618A106 106 0 0 1 616 724H302" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="110" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/>
    <!-- small-size variant: the tail itself carries the live colour -->
    <path d="M342 724H302" fill="none" stroke-width="118" stroke-linecap="round" stroke-linejoin="round" stroke="url(#coral)"/>
  </g>
</svg>
