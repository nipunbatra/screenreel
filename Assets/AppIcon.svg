    <linearGradient id="backgroundB" x1="118" y1="58" x2="890" y2="982" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17243A"/>
      <stop offset="0.44" stop-color="#0B1728"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
    <radialGradient id="navyLiftB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(510 214) rotate(90) scale(512 565)">
      <stop stop-color="#263A58" stop-opacity="0.72"/>
      <stop offset="0.52" stop-color="#13233A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#050B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 308) rotate(134) scale(330)">
      <stop stop-color="#74F0C4" stop-opacity="0.30"/>
      <stop offset="0.48" stop-color="#52DDB5" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#52DDB5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 716) rotate(-42) scale(352)">
      <stop stop-color="#FF745B" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#FF664D" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FF664D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topGlassB" x1="512" y1="22" x2="512" y2="284" gradientUnits="userSpaceOnUse">
