    </linearGradient>
    <linearGradient id="glyphStrokeB" x1="276" y1="304" x2="763" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A0FFE0"/>
      <stop offset="0.46" stop-color="#63E6BE"/>
