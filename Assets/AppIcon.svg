    </linearGradient>
    <linearGradient id="rimB" x1="132" y1="88" x2="894" y2="936" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7D8F1" stop-opacity="0.37"/>
      <stop offset="0.29" stop-color="#69F0C1" stop-opacity="0.12"/>
      <stop offset="0.70" stop-color="#FF8067" stop-opacity="0.08"/>
