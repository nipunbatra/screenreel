    <circle cx="760" cy="308" r="268" fill="url(#mintGlowB)" filter="url(#ambientBlurB)"/>
    <circle cx="320" cy="716" r="280" fill="url(#coralGlowB)" filter="url(#ambientBlurB)"/>
    <ellipse cx="512" cy="40" rx="430" ry="238" fill="url(#topGlassB)" filter="url(#ambientBlurB)"/>
    <rect y="586" width="1024" height="438" fill="url(#bottomVignetteB)"/>

    <path d="M160 216C235 105 356 61 512 61C668 61 789 105 864 216" fill="none" stroke="#DDF2FF" stroke-opacity="0.105" stroke-width="7" stroke-linecap="round"/>
    <rect x="9" y="9" width="1006" height="1006" rx="224" fill="none" stroke="url(#rimB)" stroke-width="11"/>

    <g opacity="0.28" filter="url(#glyphHaloB)">
      <rect x="207" y="265" width="610" height="494" rx="127" fill="none" stroke="url(#glyphStrokeB)" stroke-width="28"/>
      <circle cx="512" cy="487" r="118" fill="none" stroke="url(#orbitB)" stroke-width="27"/>
      <circle cx="512" cy="487" r="78" fill="#FF725B"/>
    </g>

    <g filter="url(#glyphShadowB)">
      <rect x="207" y="265" width="610" height="494" rx="127" fill="#081523" fill-opacity="0.52" stroke="url(#glyphStrokeB)" stroke-width="21"/>
      <path d="M310 306H711C743 306 769 332 769 364" fill="none" stroke="#D5FFF1" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round"/>
      <circle cx="512" cy="487" r="134" fill="#07111D" fill-opacity="0.32" stroke="#8FF8D6" stroke-opacity="0.10" stroke-width="2"/>
      <circle cx="512" cy="487" r="114" fill="none" stroke="url(#orbitB)" stroke-width="19" stroke-linecap="round" stroke-dasharray="158 21" transform="rotate(-22.5 512 487)"/>
      <circle cx="512" cy="487" r="75" fill="url(#recordB)" mask="url(#reelMaskB)"/>
      <circle cx="512" cy="487" r="15" fill="#B6FFE7"/>
      <circle cx="507" cy="482" r="5" fill="#FFFFFF" fill-opacity="0.68"/>
    </g>
  </g>
